<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Converter & Editor Pro</title>
<style>
  :root{
    --bg:#0f172a;--panel:#1e293b;--panel2:#334155;--text:#f8fafc;--accent:#38bdf8;--success:#4ade80;--danger:#f87171;--border:#475569
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{height:100vh;display:flex;background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;overflow:hidden}

  /* Sidebar */
.sidebar{width:350px;background:var(--panel);border-right:1px solid var(--border);padding:24px;display:flex;flex-direction:column;gap:20px;overflow-y:auto}
.sidebar h2{font-size:1.3rem;color:var(--accent);display:flex;align-items:center;gap:10px}
.section{background:var(--panel2);padding:16px;border-radius:12px;border:1px solid var(--border)}
.section h3{font-size:0.85rem;margin-bottom:12px;opacity:0.8;text-transform:uppercase;letter-spacing:1px}

  /* Upload Area */
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:30px;text-align:center;cursor:pointer;transition:0.3s;background:rgba(56,189,248,0.05)}
.upload-zone.dragover{border-color:var(--accent);background:rgba(56,189,248,0.15)}
.upload-zone input{display:none}
.file-info{margin-top:10px;font-size:0.85rem;opacity:0.7;word-break:break-all}

  /* Operations Grid */
.ops-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.op-btn{padding:12px;border-radius:10px;background:var(--panel);border:1px solid var(--border);cursor:pointer;transition:0.2s;text-align:center;font-size:0.85rem}
.op-btn:hover{background:var(--accent);color:#000;border-color:var(--accent);transform:translateY(-2px)}
.op-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.op-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}

  /* Preview Area */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.toolbar{padding:16px 24px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;justify-content:space-between}
.toolbar-left{display:flex;gap:12px;align-items:center}
  button{padding:10px 18px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--accent),#0ea5e9);color:#000;cursor:pointer;font-weight:600;transition:0.2s;font-size:0.85rem}
  button:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(56,189,248,0.4)}
  button:disabled{opacity:0.4;cursor:not-allowed}
  button.secondary{background:linear-gradient(135deg,#64748b,#475569);color:#fff}
  button.success{background:linear-gradient(135deg,var(--success),#16a34a);color:#000}

.preview-area{flex:1;padding:30px;overflow:auto;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1e293b,#0f172a)}
.preview-box{width:100%;max-width:900px;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.4);padding:40px;color:#1e293b;min-height:500px;overflow:auto}
.preview-box textarea{width:100%;height:400px;padding:16px;border:1px solid #e2e8f0;border-radius:8px;font-family:'Courier New',monospace;font-size:0.9rem;resize:vertical}

  /* Status & Progress */
.status-bar{padding:12px 24px;background:var(--panel2);border-top:1px solid var(--border);font-size:0.85rem;display:flex;gap:20px;align-items:center}
.progress-bar{flex:1;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:0.3s}
.status-text{white-space:nowrap}
.error-msg{color:var(--danger)}
.success-msg{color:var(--success)}

  /* Loading Spinner */
.spinner{width:20px;height:20px;border:3px solid rgba(255,255,255,0.2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>📦 Data Converter Pro</h2>

    <div class="section">
      <h3>1. Upload File</h3>
      <div class="upload-zone" id="uploadZone">
        <div>📁 Drag & Drop or Click to Upload</div>
        <div class="file-info" id="fileInfo">No file selected</div>
        <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.pdf,.docx,.txt,.pptx">
      </div>
    </div>

    <div class="section">
      <h3>2. Choose Operation</h3>
      <div class="ops-grid" id="opsGrid">
        <div class="op-btn" data-op="img2text">IMG → TEXT</div>
        <div class="op-btn" data-op="text2pdf">TEXT → PDF</div>
        <div class="op-btn" data-op="text2docx">TEXT → DOCX</div>
        <div class="op-btn" data-op="pdf2text">PDF → TEXT</div>
        <div class="op-btn" data-op="docx2pdf">DOCX → PDF</div>
        <div class="op-btn" data-op="img2pdf">IMG → PDF</div>
        <div class="op-btn" data-op="text2ppt">TEXT → PPT</div>
        <div class="op-btn" data-op="ppt2img">PPT → IMG</div>
      </div>
    </div>

    <div class="section">
      <h3>3. Email Export</h3>
      <div class="form-group">
        <input type="email" id="emailInput" placeholder="recipient@gmail.com" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:#0f172a;color:var(--text)">
        <button class="secondary" onclick="sendEmail()" style="width:100%;margin-top:8px">📧 Send via Gmail</button>
        <div style="font-size:0.75rem;opacity:0.6;margin-top:6px">* Opens Gmail compose with file attached</div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="toolbar">
      <div class="toolbar-left">
        <button onclick="processFile()" id="processBtn" disabled>⚡ Convert</button>
        <button class="success" onclick="downloadFile()" id="downloadBtn" disabled>💾 Download</button>
        <button class="secondary" onclick="clearAll()">🗑️ Clear</button>
      </div>
      <div class="spinner" id="spinner"></div>
    </div>

    <div class="preview-area">
      <div class="preview-box" id="previewBox">
        <div style="text-align:center;opacity:0.5;padding:60px">
          <div style="font-size:3rem;margin-bottom:16px">📄</div>
          <div>Upload a file to start converting</div>
        </div>
      </div>
    </div>

    <div class="status-bar">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="status-text" id="statusText">Ready</div>
    </div>
  </div>

<!-- Libraries via CDN -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@9.0.4/build/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.min.js"></script>

<script>
// ============ STATE ============
const state={
  file:null,
  fileType:null,
  fileContent:null,
  operation:null,
  resultBlob:null,
  resultFilename:'converted-file'
};

// ============ UPLOAD HANDLING ============
const uploadZone=document.getElementById('uploadZone');
const fileInput=document.getElementById('fileInput');
const fileInfo=document.getElementById('fileInfo');

uploadZone.onclick=()=>fileInput.click();
uploadZone.ondragover=(e)=>{e.preventDefault();uploadZone.classList.add('dragover')};
uploadZone.ondragleave=()=>uploadZone.classList.remove('dragover');
uploadZone.ondrop=(e)=>{e.preventDefault();uploadZone.classList.remove('dragover');if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0])};
fileInput.onchange=(e)=>{if(e.target.files[0])handleFile(e.target.files[0])};

function handleFile(file){
  state.file=file;
  const ext=file.name.split('.').pop().toLowerCase();
  state.fileType=ext;
  state.resultFilename=`converted-${file.name.split('.')[0]}`;
  fileInfo.textContent=`${file.name} (${(file.size/1024).toFixed(1)}KB)`;
  updateStatus(`File loaded: ${file.name}`, 'success');
  enableOperations(ext);
  previewFile(file,ext);
  document.getElementById('processBtn').disabled=false;
}

function enableOperations(ext){
  document.querySelectorAll('.op-btn').forEach(btn=>{
    const op=btn.dataset.op;
    const allowed={
      'jpg':['img2text','img2pdf'],'jpeg':['img2text','img2pdf'],'png':['img2text','img2pdf'],
      'pdf':['pdf2text','pdf2img'],'docx':['docx2pdf'],'txt':['text2pdf','text2docx','text2ppt'],
      'pptx':['ppt2img']
    };
    btn.disabled=!allowed[ext]?.includes(op);
  });
}

function previewFile(file,ext){
  const preview=document.getElementById('previewBox');
  if(['jpg','jpeg','png'].includes(ext)){
    const reader=new FileReader();
    reader.onload=(e)=>{preview.innerHTML=`<img src="${e.target.result}" style="max-width:100%;border-radius:8px">`};
    reader.readAsDataURL(file);
  }else if(ext==='txt'){
    const reader=new FileReader();
    reader.onload=(e)=>{preview.innerHTML=`<textarea id="textEditor">${e.target.result}</textarea>`;state.fileContent=e.target.result};
    reader.readAsText(file);
  }else{
    preview.innerHTML=`<div style="text-align:center;opacity:0.5;padding:60px"><div style="font-size:3rem;margin-bottom:16px">📄</div><div>${file.name}</div><div style="font-size:0.85rem;margin-top:8px">Preview not available for this format</div></div>`;
  }
}

// ============ OPERATION SELECTION ============
document.querySelectorAll('.op-btn').forEach(btn=>{
  btn.onclick=()=>{
    if(btn.disabled)return;
    document.querySelectorAll('.op-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.operation=btn.dataset.op;
    updateStatus(`Operation selected: ${btn.textContent}`, 'success');
  }
});

// ============ CONVERSION LOGIC ============
async function processFile(){
  if(!state.file||!state.operation)return;
  setLoading(true);

  try{
    updateProgress(10);
    switch(state.operation){
      case 'img2text': await convertImgToText(); break;
      case 'text2pdf': await convertTextToPDF(); break;
      case 'text2docx': await convertTextToDOCX(); break;
      case 'pdf2text': await convertPDFToText(); break;
      case 'docx2pdf': await convertDOCXToPDF(); break;
      case 'img2pdf': await convertImgToPDF(); break;
      case 'text2ppt': await convertTextToPPT(); break;
      case 'ppt2img': throw new Error('PPT to IMG requires backend processing');
    }
    updateProgress(100);
    updateStatus('Conversion completed successfully!', 'success');
    document.getElementById('downloadBtn').disabled=false;
  }catch(err){
    updateStatus('Error: '+err.message,'error');
    console.error(err);
  }finally{setLoading(false)}
}

// 1. IMAGE TO TEXT - OCR using Tesseract.js
async function convertImgToText(){
  updateProgress(30);
  const {data:{text}}=await Tesseract.recognize(state.file,'eng',{logger:m=>updateProgress(30+m.progress*60)});
  state.fileContent=text;
  state.resultFilename+='.txt';
  document.getElementById('previewBox').innerHTML=`<textarea id="textEditor">${text}</textarea>`;
}

// 2. TEXT TO PDF - using PDF-Lib
async function convertTextToPDF(){
  updateProgress(30);
  const text=document.getElementById('textEditor')?.value||state.fileContent||'';
  const pdfDoc=await PDFLib.PDFDocument.create();
  const page=pdfDoc.addPage([595,842]); // A4
  const {width,height}=page.getSize();
  const font=await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
  const fontSize=12;lineHeight=18;
  const words=text.split(' ');let y=height-50;let line='';

  words.forEach(word=>{
    const testLine=line+word+' ';
    const testWidth=font.widthOfTextAtSize(testLine,fontSize);
    if(testWidth>width-100&&line){page.drawText(line,{x:50,y,fontSize});line=word+' ';y-=lineHeight;if(y<50){pdfDoc.addPage([595,842]);y=height-50}}
    else{line=testLine}
  });
  if(line)page.drawText(line,{x:50,y,fontSize});
  updateProgress(80);
  state.resultBlob=await pdfDoc.save({useObjectStreams:false});
  state.resultFilename+='.pdf';
}

// 3. TEXT TO DOCX - using docx.js
async function convertTextToDOCX(){
  updateProgress(40);
  const text=document.getElementById('textEditor')?.value||state.fileContent||'';
  const doc=new docx.Document({
    sections:[{children:[new docx.Paragraph({text:text})]}]
  });
  updateProgress(70);
  state.resultBlob=await docx.Packer.toBlob(doc);
  state.resultFilename+='.docx';
}

// 4. PDF TO TEXT - basic extraction
async function convertPDFToText(){
  updateProgress(30);
  const arrayBuffer=await state.file.arrayBuffer();
  const pdfDoc=await PDFLib.PDFDocument.load(arrayBuffer);
  let text='';
  for(let i=0;i<pdfDoc.getPageCount();i++){
    const page=pdfDoc.getPage(i);
    text+=`--- Page ${i+1} ---\n[PDF text extraction requires pdf.js for full content]\n\n`;
  }
  text+='Note: For full PDF text extraction, use pdf.js library. This is a basic structure.';
  state.fileContent=text;
  state.resultFilename+='.txt';
  document.getElementById('previewBox').innerHTML=`<textarea id="textEditor">${text}</textarea>`;
}

// 5. DOCX TO PDF - requires rendering
async function convertDOCXToPDF(){
  throw new Error('DOCX to PDF requires server-side conversion. Use text extraction as intermediate step.');
}

// 6. IMAGE TO PDF - wrap image in PDF
async function convertImgToPDF(){
  updateProgress(40);
  const pdfDoc=await PDFLib.PDFDocument.create();
  const imageBytes=await state.file.arrayBuffer();
  let image;
  if(state.fileType==='png'){image=await pdfDoc.embedPng(imageBytes)}
  else{image=await pdfDoc.embedJpg(imageBytes)}
  const {width,height}=image.scale(0.5);
  const page=pdfDoc.addPage([width,height]);
  page.drawImage(image,{x:0,y:0,width,height});
  updateProgress(80);
  state.resultBlob=await pdfDoc.save();
  state.resultFilename+='.pdf';
}

// 7. TEXT TO PPT - using PPTXGenJS
async function convertTextToPPT(){
  updateProgress(40);
  const text=document.getElementById('textEditor')?.value||state.fileContent||'';
  const pptx=new PptxGenJS();
  const slide=pptx.addSlide();
  slide.addText(text,{x:0.5,y:0.5,w:9,h:5,fontSize:18});
  updateProgress(80);
  state.resultBlob=await pptx.writeFile({fileName:state.resultFilename+'.pptx'});
}

// ============ DOWNLOAD ============
function downloadFile(){
  if(!state.resultBlob)return;
  const url=URL.createObjectURL(state.resultBlob);
  const a=document.createElement('a');a.href=url;a.download=state.resultFilename;a.click();
  URL.revokeObjectURL(url);
  updateStatus('File downloaded successfully!','success');
}

// ============ GMAIL SEND ============
function sendEmail(){
  const email=document.getElementById('emailInput').value;
  if(!email||!email.includes('@')){updateStatus('Please enter a valid email','error');return}
  if(!state.resultBlob){updateStatus('Please convert a file first','error');return}

  const subject=encodeURIComponent('Converted File - Data Converter Pro');
  const body=encodeURIComponent(`Hello,\n\nPlease find the converted file attached.\n\nGenerated using Data Converter Pro.`);
  window.open(`https://mail.google.com/mail/?view=cm&to=${email}&su=${subject}&body=${body}`,'_blank');
  updateStatus('Gmail compose window opened','success');
}

// ============ UTILITIES ============
function clearAll(){
  state.file=null;state.fileContent=null;state.resultBlob=null;state.operation=null;
  fileInput.value='';fileInfo.textContent='No file selected';
  document.getElementById('previewBox').innerHTML=`<div style="text-align:center;opacity:0.5;padding:60px"><div style="font-size:3rem;margin-bottom:16px">📄</div><div>Upload a file to start converting</div></div>`;
  document.querySelectorAll('.op-btn').forEach(b=>{b.classList.remove('active');b.disabled=true});
  document.getElementById('processBtn').disabled=true;
  document.getElementById('downloadBtn').disabled=true;
  updateProgress(0);updateStatus('Ready','');
}

function setLoading(isLoading){document.getElementById('spinner').style.display=isLoading?'block':'none';document.getElementById('processBtn').disabled=isLoading}
function updateProgress(percent){document.getElementById('progressFill').style.width=percent+'%'}
function updateStatus(msg,type=''){const el=document.getElementById('statusText');el.textContent=msg;el.className='status-text '+type+'-msg'}

// ============ ERROR BOUNDARY ============
window.addEventListener('error',(e)=>{updateStatus('Unexpected error: '+e.message,'error');setLoading(false)});
</script>
</body>
</html>
