<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Translator Pro</title>
<style>
  :root{
    --bg:#0f172a;--panel:#1e293b;--panel2:#334155;--text:#f8fafc;--accent:#22d3ee;--border:#475569;--shadow:rgba(0,0,0,0.4)
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1e293b,#0f172a);color:var(--text);font-family:'Segoe UI',sans-serif;padding:20px}

.translator-container{width:100%;max-width:1100px;background:var(--panel);border:1px solid var(--border);border-radius:24px;box-shadow:0 30px 80px var(--shadow);overflow:hidden}
.header{padding:24px 30px;background:linear-gradient(135deg,#0ea5e9,#06b6d4);display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:1.5rem;font-weight:600;display:flex;align-items:center;gap:12px}
.theme-toggle{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,0.2);border:none;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center}

.main-content{padding:30px;display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:start}
  @media(max-width:900px){.main-content{grid-template-columns:1fr;gap:30px}}

.lang-panel{background:var(--panel2);border:1px solid var(--border);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.lang-header{display:flex;justify-content:space-between;align-items:center}
.lang-select{padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);outline:none;font-size:0.9rem;min-width:180px}
  textarea{width:100%;min-height:200px;padding:16px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);outline:none;font-size:1rem;resize:vertical;font-family:inherit;line-height:1.6}
  textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,211,238,0.2)}

.swap-btn{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#06b6d4);border:none;color:#000;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.4rem;transition:0.3s;align-self:center}
.swap-btn:hover{transform:rotate(180deg) scale(1.1)}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tool-btn{padding:8px 14px;border-radius:8px;background:var(--panel);border:1px solid var(--border);cursor:pointer;font-size:0.85rem;transition:0.2s;display:flex;align-items:center;gap:6px}
.tool-btn:hover{background:var(--accent);color:#000;border-color:var(--accent)}
.char-count{margin-left:auto;font-size:0.8rem;opacity:0.6}

.actions{display:flex;gap:12px;padding:0 30px 30px}
  button.primary{flex:1;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--accent),#06b6d4);color:#000;cursor:pointer;font-weight:600;font-size:1rem;transition:0.2s}
  button.primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(34,211,238,0.4)}
  button.primary:disabled{opacity:0.5;cursor:not-allowed}

.status-bar{padding:12px 30px;background:var(--panel2);border-top:1px solid var(--border);font-size:0.85rem;display:flex;justify-content:space-between;align-items:center}
.status-text{opacity:0.8}
.error{color:#f87171}.success{color:#4ade80}

.spinner{width:18px;height:18px;border:3px solid rgba(255,255,255,0.2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;display:none}
  @keyframes spin{to{transform:rotate(360deg)}}

.history-panel{padding:0 30px 30px}
.history-list{display:flex;flex-direction:column;gap:8px;max-height:150px;overflow-y:auto}
.history-item{padding:10px 14px;background:var(--panel2);border-radius:8px;font-size:0.85rem;cursor:pointer;transition:0.2s;border:1px solid transparent}
.history-item:hover{border-color:var(--accent);background:var(--bg)}
.history-item.meta{opacity:0.5;font-size:0.75rem;margin-top:4px}
</style>
</head>
<body>
<div class="translator-container">
  <div class="header">
    <h1>🌐 Word Translator Pro</h1>
    <button class="theme-toggle" id="themeToggle">🌙</button>
  </div>

  <div class="main-content">
    <!-- Source Language -->
    <div class="lang-panel">
      <div class="lang-header">
        <label>From</label>
        <select class="lang-select" id="sourceLang"></select>
      </div>
      <textarea id="sourceText" placeholder="Enter text to translate..."></textarea>
      <div class="toolbar">
        <button class="tool-btn" onclick="pasteText()">📋 Paste</button>
        <button class="tool-btn" onclick="clearSource()">🗑️ Clear</button>
        <button class="tool-btn" onclick="speakText('source')">🔊 Speak</button>
        <span class="char-count" id="sourceCharCount">0 / 5000</span>
      </div>
    </div>

    <!-- Swap Button -->
    <button class="swap-btn" onclick="swapLanguages()" title="Swap Languages">⇄</button>

    <!-- Target Language -->
    <div class="lang-panel">
      <div class="lang-header">
        <label>To</label>
        <select class="lang-select" id="targetLang"></select>
      </div>
      <textarea id="targetText" placeholder="Translation will appear here..." readonly></textarea>
      <div class="toolbar">
        <button class="tool-btn" onclick="copyText()">� copy</button>
        <button class="tool-btn" onclick="speakText('target')">🔊 Speak</button>
        <button class="tool-btn" onclick="saveToHistory()">💾 Save</button>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="translateBtn" onclick="translateText()">⚡ Translate</button>
  </div>

  <div class="history-panel">
    <h3 style="margin-bottom:12px;font-size:0.9rem;opacity:0.8">Translation History</h3>
    <div class="history-list" id="historyList"></div>
  </div>

  <div class="status-bar">
    <div class="status-text" id="statusText">Ready</div>
    <div class="spinner" id="spinner"></div>
  </div>
</div>

<script>
// ============ LANGUAGE LIST - 33 Languages ============
const languages=[
  {code:'en',name:'English'},{code:'mr',name:'Marathi'},{code:'hi',name:'Hindi'},{code:'ta',name:'Tamil'},
  {code:'te',name:'Telugu'},{code:'kn',name:'Kannada'},{code:'ml',name:'Malayalam'},{code:'bn',name:'Bengali'},
  {code:'gu',name:'Gujarati'},{code:'pa',name:'Punjabi'},{code:'ur',name:'Urdu'},{code:'or',name:'Odia'},
  {code:'es',name:'Spanish'},{code:'fr',name:'French'},{code:'de',name:'German'},{code:'it',name:'Italian'},
  {code:'pt',name:'Portuguese'},{code:'ru',name:'Russian'},{code:'zh',name:'Chinese'},{code:'ja',name:'Japanese'},
  {code:'ko',name:'Korean'},{code:'ar',name:'Arabic'},{code:'tr',name:'Turkish'},{code:'nl',name:'Dutch'},
  {code:'sv',name:'Swedish'},{code:'pl',name:'Polish'},{code:'cs',name:'Czech'},{code:'da',name:'Danish'},
  {code:'fi',name:'Finnish'},{code:'el',name:'Greek'},{code:'he',name:'Hebrew'},{code:'th',name:'Thai'},
  {code:'vi',name:'Vietnamese'}
];

const state={
  sourceLang:'en',
  targetLang:'mr',
  history:[],
  theme:'dark'
};

// ============ INITIALIZE LANGUAGE SELECTORS ============
function initLanguageSelectors(){
  const sourceSelect=document.getElementById('sourceLang');
  const targetSelect=document.getElementById('targetLang');

  languages.forEach(lang=>{
    const opt1=document.createElement('option');opt1.value=lang.code;opt1.textContent=lang.name;
    const opt2=document.createElement('option');opt2.value=lang.code;opt2.textContent=lang.name;
    if(lang.code==='en')opt1.selected=true;
    if(lang.code==='mr')opt2.selected=true;
    sourceSelect.appendChild(opt1);targetSelect.appendChild(opt2);
  });

  sourceSelect.onchange=(e)=>{state.sourceLang=e.target.value;updateStatus(`Source: ${e.target.options[e.target.selectedIndex].text}`)}
  targetSelect.onchange=(e)=>{state.targetLang=e.target.value;updateStatus(`Target: ${e.target.options[e.target.selectedIndex].text}`)}
}
initLanguageSelectors();

// ============ TRANSLATION API ============
const MAX_CHARS=5000;
const sourceTextarea=document.getElementById('sourceText');
const targetTextarea=document.getElementById('targetText');
const sourceCharCount=document.getElementById('sourceCharCount');

sourceTextarea.oninput=()=>{const len=sourceTextarea.value.length;sourceCharCount.textContent=`${len} / ${MAX_CHARS}`;if(len>MAX_CHARS){sourceTextarea.value=sourceTextarea.value.substring(0,MAX_CHARS);sourceCharCount.textContent=`${MAX_CHARS} / ${MAX_CHARS}`}};

async function translateText(){
  const text=sourceTextarea.value.trim();
  if(!text){updateStatus('Please enter text to translate','error');return}
  if(state.sourceLang===state.targetLang){targetTextarea.value=text;updateStatus('Source and target languages are same','success');return}

  setLoading(true);
  updateStatus('Translating...');

  try{
    // Using MyMemory Free Translation API - no API key required
    const url=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${state.sourceLang}|${state.targetLang}`;
    const response=await fetch(url);

    if(!response.ok)throw new Error('Translation service unavailable');

    const data=await response.json();
    if(data.responseStatus!==200)throw new Error(data.responseDetails||'Translation failed');

    const translatedText=data.responseData.translatedText;
    targetTextarea.value=translatedText;
    updateStatus('Translation completed','success');
    addToHistory(text,translatedText);

  }catch(error){
    updateStatus('Translation failed: '+error.message,'error');
    targetTextarea.value='Translation error. Please try again.';
  }finally{setLoading(false)}
}

// ============ UTILITY FUNCTIONS ============
function swapLanguages(){
  const temp=state.sourceLang;state.sourceLang=state.targetLang;state.targetLang=temp;
  document.getElementById('sourceLang').value=state.sourceLang;
  document.getElementById('targetLang').value=state.targetLang;
  const tempText=sourceTextarea.value;sourceTextarea.value=targetTextarea.value;targetTextarea.value=tempText;
  updateStatus('Languages swapped');
}

function clearSource(){sourceTextarea.value='';targetTextarea.value='';sourceCharCount.textContent='0 / 5000';updateStatus('Cleared')}

async function pasteText(){
  try{
    const text=await navigator.clipboard.readText();sourceTextarea.value=text;sourceTextarea.dispatchEvent(new Event('input'));updateStatus('Text pasted from clipboard','success');
  }catch(e){updateStatus('Clipboard access denied','error')}
}

async function copyText(){
  if(!targetTextarea.value){updateStatus('Nothing to copy','error');return}
  try{
    await navigator.clipboard.writeText(targetTextarea.value);updateStatus('Copied to clipboard','success');
  }catch(e){updateStatus('Copy failed','error')}
}

// ============ TEXT TO SPEECH ============
function speakText(type){
  const text=type==='source'?sourceTextarea.value:targetTextarea.value;
  const lang=type==='source'?state.sourceLang:state.targetLang;
  if(!text){updateStatus('No text to speak','error');return}
  if(!('speechSynthesis'in window)){updateStatus('Text-to-speech not supported','error');return}

  speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang=lang;utterance.rate=0.9;utterance.pitch=1;
  speechSynthesis.speak(utterance);
  updateStatus(`Speaking ${type} text...`);
}

// ============ HISTORY MANAGEMENT ============
function addToHistory(source,target){
  state.history.unshift({source,target,sourceLang:state.sourceLang,targetLang:state.targetLang,timestamp:Date.now()});
  if(state.history.length>20)state.history.pop();
  renderHistory();
  saveHistory();
}

function renderHistory(){
  const historyList=document.getElementById('historyList');
  if(state.history.length===0){historyList.innerHTML='<div style="opacity:0.5;text-align:center;padding:20px">No history yet</div>';return}
  historyList.innerHTML=state.history.map((item,i)=>`
    <div class="history-item" onclick="loadFromHistory(${i})">
      <div><strong>${item.source.substring(0,50)}${item.source.length>50?'...':''}</strong></div>
      <div>${item.target.substring(0,50)}${item.target.length>50?'...':''}</div>
      <div class="meta">${getLangName(item.sourceLang)} → ${getLangName(item.targetLang)} • ${timeAgo(item.timestamp)}</div>
    </div>
  `).join('');
}

function loadFromHistory(index){
  const item=state.history[index];
  state.sourceLang=item.sourceLang;state.targetLang=item.targetLang;
  document.getElementById('sourceLang').value=item.sourceLang;
  document.getElementById('targetLang').value=item.targetLang;
  sourceTextarea.value=item.source;targetTextarea.value=item.target;
  sourceTextarea.dispatchEvent(new Event('input'));
  updateStatus('Loaded from history');
}

function saveToHistory(){
  if(!targetTextarea.value){updateStatus('No translation to save','error');return}
  addToHistory(sourceTextarea.value,targetTextarea.value);
  updateStatus('Saved to history','success');
}

function getLangName(code){return languages.find(l=>l.code===code)?.name||code}
function timeAgo(timestamp){const seconds=Math.floor((Date.now()-timestamp)/1000);if(seconds<60)return'just now';if(seconds<3600)return Math.floor(seconds/60)+'m ago';if(seconds<86400)return Math.floor(seconds/3600)+'h ago';return Math.floor(seconds/86400)+'d ago'}

// ============ THEME TOGGLE ============
const themeToggle=document.getElementById('themeToggle');
themeToggle.onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';document.body.style.background=state.theme==='dark'?'radial-gradient(ellipse at center,#1e293b,#0f172a)':'radial-gradient(ellipse at center,#e0f2fe,#f8fafc)';document.body.style.color=state.theme==='dark'?'#f8fafc':'#0f172a';themeToggle.textContent=state.theme==='dark'?'🌙':'☀️'};

// ============ STATUS & LOADING ============
function setLoading(isLoading){document.getElementById('spinner').style.display=isLoading?'block':'none';document.getElementById('translateBtn').disabled=isLoading}
function updateStatus(msg,type=''){const el=document.getElementById('statusText');el.textContent=msg;el.className='status-text '+type}

// ============ LOCALSTORAGE ============
function saveHistory(){try{localStorage.setItem('translatorHistory',JSON.stringify(state.history))}catch(e){console.error('Save failed:',e)}}
function loadHistory(){try{const saved=localStorage.getItem('translatorHistory');if(saved){state.history=JSON.parse(saved);renderHistory()}}catch(e){console.error('Load failed:',e)}}
loadHistory();

// ============ KEYBOARD SHORTCUTS ============
document.addEventListener('keydown',(e)=>{if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();translateText()}if(e.ctrlKey&&e.key==='k'){e.preventDefault();swapLanguages()}});

// ============ ERROR BOUNDARY ============
window.addEventListener('error',(e)=>{updateStatus('Unexpected error: '+e.message,'error');setLoading(false)});
</script>
</body>
</html>
